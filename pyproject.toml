[project]
name = "ftse50-news-agent"
version = "0.1.0"
description = "Autonomous agentic research system: top-50 FTSE companies by market cap, latest market-moving news ranked by an Ollama LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FTSE 50 Research Agent" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pydantic-ai>=0.1.0",
    "pydantic-evals>=0.1.0",
    "openai>=1.40",
    "yfinance>=0.2.40",
    "crawl4ai>=0.5.0",
    "sentence-transformers>=2.7",
    "pandas>=2.0",
    "lxml>=5.0",
    "requests>=2.31",
    "httpx>=0.27",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["config", "agent", "nodes", "utils"]
