# Long research jobs: the default delivery-ack timeout (30 min) is too tight for slow CPU LLM runs.
consumer_timeout = 3600000

# Celery's remote-control (pidbox) queues are transient and non-exclusive, which RabbitMQ 4 deprecates by default.
# Permit them explicitly (used for `celery inspect ping` health checks). Revisit when Celery/Kombu support
# RabbitMQ 4 transient queues natively; the durable job queue itself is unaffected.
deprecated_features.permit.transient_nonexcl_queues = true
